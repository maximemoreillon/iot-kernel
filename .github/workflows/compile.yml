name: Compile

# Compiles the examples for ESP8266 and ESP32, with the dependencies installed from the Library Manager

on:
  push:
  pull_request:

jobs:
  compile:
    # NOTE: arduino/compile-sketches installs a Python version not available on Ubuntu 26.04 (ubuntu-latest)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        board:
          - fqbn: esp8266:esp8266:nodemcuv2
            platform: esp8266:esp8266
            source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
          - fqbn: esp32:esp32:esp32
            platform: esp32:esp32
            source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: |
            - name: ${{ matrix.board.platform }}
              source-url: ${{ matrix.board.source-url }}
          libraries: |
            - source-path: ./
            - name: PubSubClient
            - name: ArduinoJson
            - name: ESP Async WebServer
            - name: Async TCP
            - name: ESP Async TCP
          sketch-paths: |
            - examples
